name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore solutions/SpareParts.Backend.sln

      - name: Build (warnings as errors)
        run: dotnet build solutions/SpareParts.Backend.sln --configuration Release --no-restore

      - name: Collect changed C# files
        id: changed_files
        shell: pwsh
        run: |
          $baseRef = "${{ github.base_ref }}"
          if ([string]::IsNullOrWhiteSpace($baseRef)) {
            $base = "HEAD~1"
          } else {
            $base = "origin/$baseRef"
            git fetch origin $baseRef --depth=1
          }

          $files = git diff --name-only $base...HEAD -- '*.cs' '*.csproj' '*.props'
          if (-not $files) {
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $absolute = $files | ForEach-Object { Join-Path (Get-Location) $_ }
          "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "files<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $absolute | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: dotnet format on touched files
        if: steps.changed_files.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          $files = @"
          ${{ steps.changed_files.outputs.files }}
          "@ -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          dotnet format solutions/SpareParts.Backend.sln --verify-no-changes --severity warn --include $files

      - name: Test suites
        run: |
          dotnet test tests/SpareParts.ArchitectureTests/SpareParts.ArchitectureTests.csproj \
            --configuration Release --no-build \
            --logger "console;verbosity=minimal"

  sql-server-integration:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SQL Server Docker image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/sqlserver.tar
          key: docker-mssql-server-2022-latest-v1

      - name: Load cached SQL Server image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load -i /tmp/sqlserver.tar

      - name: Pull and save SQL Server image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker save mcr.microsoft.com/mssql/server:2022-latest -o /tmp/sqlserver.tar

      - name: Restore & Build
        run: |
          dotnet restore tests/SpareParts.IntegrationTests/SpareParts.IntegrationTests.csproj
          dotnet build tests/SpareParts.IntegrationTests/SpareParts.IntegrationTests.csproj \
            --configuration Release --no-restore

      - name: Test SQL Server integration suite
        run: |
          dotnet test tests/SpareParts.IntegrationTests/SpareParts.IntegrationTests.csproj \
            --configuration Release --no-build \
            --logger "console;verbosity=minimal"
